spring:
  application:
    name: new-sensor-data-server
  profiles:
    active: test

server:
  port: 8082

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    net.vivans.dcim: DEBUG
  file:
    name: ${LOG_FILE_NAME:./logs/application.log}

app:
  version: 1.0.0

security:
  auth-enabled: true
  api-key: ${SENSOR_DATA_API_KEY:sensor-data-server}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

manager:
  service:
    url: ${MANAGER_SERVICE_URL:http://localhost:8080}
    api-key: ${MANAGER_API_KEY:sensor-data-service}
    enabled: ${MANAGER_LOOKUP_ENABLED:true}

sensor:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:new-sensor-data-server}
    topic: ${MQTT_TOPIC:dcim/sensor/data}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

influx:
  enabled: ${INFLUX_ENABLED:false}
  url: ${INFLUX_URL:http://localhost:8086}
  token: ${INFLUX_TOKEN:}
  org: ${INFLUX_ORG:vivans}
  bucket: ${INFLUX_BUCKET:dcim}
  measurement: ${INFLUX_MEASUREMENT:dcim_sensor}
